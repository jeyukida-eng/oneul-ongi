<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="오늘의 온기">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css?v=14">
  <link rel="stylesheet" href="./achievements-v7.css?v=14">

  <link rel="stylesheet" href="./premium-personal-v15.css?v=17">

  <title>오늘의 온기 — 매일 새로운 온기</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand"><span>오늘의 온기</span></div>
    <button class="install-link" type="button" data-action="install"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 16v4h14v-4"/></svg> 설치</button>
  </header>
  <main id="main-content" class="home-scroll" aria-live="polite"></main>
</div>
<div id="sheet-root" class="sheet-root" aria-live="off"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
if('serviceWorker' in navigator){
  let changed=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(changed||sessionStorage.getItem('ongi-v19-reloaded'))return;
    changed=true;
    sessionStorage.setItem('ongi-v19-reloaded','1');
    location.reload();
  });
  window.addEventListener('load',()=>navigator.serviceWorker.ready.then(reg=>reg.update()).catch(()=>{}),{once:true});
}
</script>
</body>
</html>
