name: Build app icons
on:
  push:
    paths:
      - 'icons/icon.svg'
      - '.github/workflows/build-app-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate install icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          for size in (180, 192, 512):
              target = Path(f'icons/icon-{size}.png')
              cairosvg.svg2png(url='icons/icon.svg', write_to=str(target), output_width=size, output_height=size)
              print(target, target.stat().st_size)
          PY
      - name: Commit generated icon sizes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/icon-180.png icons/icon-192.png icons/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate approved On-gi app icons"
            git push origin HEAD:main
          fi
