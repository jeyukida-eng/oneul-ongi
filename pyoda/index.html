'use strict';
const MUSIC_URL='https://kpokjlujlfdtwaevuror.supabase.co',MUSIC_KEY='sb_publishable_i8xHd_nzgoQbBWzujN3CXQ_pkQUq8nx',BOOK_URL='https://chnlljbmatsawxrrsany.supabase.co',BOOK_KEY='sb_publishable_5GSQmJ7eFEKFuPmL6dxpxA_fKct9Zdn';

function musicView(){view.innerHTML=`<section><div class="hero"><div class="eyebrow">MUSIC FOR CREATORS</div><h1>당신이 만든 이야기,<br>누군가의 하루에.</h1><div class="sub">책을 펼치고, 음악을 듣고, 함께 걸어요.</div></div><div class="row"><h2>새로 펼친 음악</h2><span class="sub">${tracks.length}곡</span></div><div class="grid">${tracks.slice(0,3).map((t,i)=>`<button class="card" data-track="${i}">${cover(t,i)}<h3>${esc(t.title)}</h3><span class="sub">${esc(t.artist)}</span></button>`).join('')}</div><p class="notice">기존 음악의 곡 정보는 연결했습니다. 이전 음원 저장소 연결이 끊겨, 현재 기존 31곡은 재생할 수 없습니다.</p><input class="search" id="query" type="search" placeholder="제목이나 아티스트 검색" aria-label="음악 검색"><div class="list" id="songs"></div><p class="footer-note">창작자의 작품과 권리를 소중히 여깁니다.<br><span class="version">PYODA · REBUILD 2026.11.09</span></p></section>`;$('#query').oninput=e=>songList(e.target.value);songList('');bindTrack();}

async function play(i){const t=tracks[i];if(t.audio_storage==='r2'){toast('이 곡은 이전 음원 저장소에 있습니다. 연결 복구 또는 원본 파일 재등록 후 들을 수 있습니다.');return}if(!musicSession){$('#login').showModal();return}try{const {data,error}=await music.storage.from('music-audio').createSignedUrl(t.audio_path,900);if(error)throw error;$('#audio').src=data.signedUrl;$('#now').textContent=t.title;$('#player').hidden=false;await $('#audio').play()}catch{toast('음원을 불러오지 못했습니다. 파일 연결 상태를 확인해야 합니다.')}}
function booksView(){view.innerHTML=`<section><div class="eyebrow">BOOKS FOR CREATORS</div><h1>마음에 남을 문장.</h1><p class="sub">작가가 직접 펼친 이야기를 만나보세요.</p><h2>새로 펼친 책</h2><div class="grid">${catalog.map((t,i)=>`<button class="card book" data-book="${i}">${cover(t,i,true)}<h3>${esc(t.title)}</h3><span class="sub">${esc(t.pen_name)} · ${t.episode_count||0}화</span></button>`).join('')}</div>${catalog.length?'':'<p class="empty">공개 작품을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</p>'}</section>`;view.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>openBook(Number(b.dataset.book)))}
async function openBook(i){const b=catalog[i];view.innerHTML='<p class="busy">회차를 불러오고 있습니다.</p>';try{const {data,error}=await books.functions.invoke('public-episodes',{body:{bookId:b.id}});if(error||!data?.ok)throw error||Error();const eps=data.episodes||[];view.innerHTML=`<section><button id="back">← 책 목록</button><h1>${esc(b.title)}</h1><p class="sub">${esc(b.pen_name)} · ${esc(b.genre)}</p><p class="sub">${esc(b.intro)}</p><h2>목차</h2><div id="episodes"></div></section>`;$('#back').onclick=()=>go('books');$('#episodes').innerHTML=eps.map((e,n)=>`<button class="episode" data-episode="${n}"><span>${e.episode_no}화 · ${esc(e.title)}</span><span class="sub">${e.locked||(!e.body&&!e.body_html)?'이용 권한 필요':'읽기 →'}</span></button>`).join('');view.querySelectorAll('[data-episode]').forEach(btn=>btn.onclick=()=>readEpisode(b,eps,Number(btn.dataset.episode),i));view.scrollTop=0}catch{view.innerHTML='<section><h2>회차를 불러오지 못했습니다.</h2><button class="primary" id="back">책 목록으로</button></section>';$('#back').onclick=()=>go('books')}}
function safeBody(e){const doc=new DOMParser().parseFromString(e.body_html||'', 'text/html');if(e.body_html){doc.body.querySelectorAll('script,style,iframe,object,embed,form,svg,math').forEach(n=>n.remove());doc.body.querySelectorAll('*').forEach(n=>{for(const a of [...n.attributes])n.removeAttribute(a.name);if(!['P','BR','STRONG','EM','B','I','H1','H2','H3','H4','UL','OL','LI','BLOCKQUOTE','SPAN','DIV'].includes(n.tagName))n.replaceWith(...n.childNodes)});return doc.body.innerHTML}return String(e.body||'').split(/\n\s*\n/).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}
function readEpisode(b,eps,n,i){const e=eps[n];if(e.locked||(!e.body&&!e.body_html)){toast('이 회차는 이용 권한이 필요합니다.');return}$('#app').classList.add('reading');view.innerHTML=`<article class="reader"><div class="tools"><button id="toc">← 목차</button><span class="sub">${e.episode_no} / ${eps.length}화</span><button id="size" aria-label="본문 글자 크기 변경">가⁺</button></div><h1>${esc(e.title)}</h1><div class="prose">${safeBody(e)}</div><div class="row"><button id="prev" class="pill" ${n===0?'disabled':''}>← 이전 화</button><button id="next" class="pill" ${n===eps.length-1?'disabled':''}>다음 화 →</button></div></article>`;$('#toc').onclick=()=>{$('#app').classList.remove('reading');openBook(i)};$('#size').onclick=()=>$('.prose').style.fontSize=$('.prose').style.fontSize==='19px'?'17px':'19px';$('#prev').onclick=()=>readEpisode(b,eps,n-1,i);$('#next').onclick=()=>readEpisode(b,eps,n+1,i);view.scrollTop=0;}
function myView(){view.innerHTML=`<section><div class="eyebrow">YOUR CREATIVE SPACE</div><h1>${session?'나의 작은 작업실.':'당신의 이야기를 펼쳐요.'}</h1><p class="sub">음악도, 책도, 당신의 이름으로.</p>${session?`<p class="notice">${esc(session.user.user_metadata?.name||session.user.user_metadata?.full_name||'펴다 회원')} 님, 반갑습니다.</p><h2>나의 작품</h2>${tracks.filter(t=>t.creator_id===musicSession?.user.id).map(t=>`<div class="creator"><b>${esc(t.title)}</b><p class="sub">${esc(t.artist)} · ${t.audio_storage==='r2'?'음원 연결 대기':'음악'}</p></div>`).join('')||'<p class="sub">연결된 음악 작품이 없습니다.</p>'}<a class="primary" href="../pyeoda/" target="_blank" rel="noopener">북스 작업실 열기 ↗</a><p class="notice">사진으로 방 꾸미기와 후원 기능은 새 앱에 아직 구현되지 않았습니다.</p><button class="pill" id="logout">로그아웃</button>`:'<button class="primary" id="mylogin">로그인하고 시작하기</button><p class="notice">기존 작품과 계정을 보존하며 새 공간을 준비하고 있습니다. 사진으로 방 꾸미기와 후원 기능은 아직 준비 중입니다.</p>'}<button class="pill" id="install">홈 화면에 추가</button><p class="footer-note">기존 작품을 삭제하거나 다른 계정으로 옮기지 않습니다.</p></section>`;if($('#mylogin'))$('#mylogin').onclick=()=>$('#login').showModal();if($('#logout'))$('#logout').onclick=async()=>{await books.auth.signOut({scope:'local'});await music.auth.signOut({scope:'local'});session=musicSession=null;authUI();render()};$('#install').onclick=()=>toast('아이폰: Safari 공유 → 홈 화면에 추가. 안드로이드: Chrome 메뉴 → 홈 화면에 추가 또는 앱 설치.');}
function render(){if(page==='music')musicView();else if(page==='books')booksView();else if(page==='my')myView();else view.innerHTML='<iframe title="펴다 워크 · 서귀포 골목 도슨트" src="https://jeyukida-eng.github.io/pyoda-walk/" allow="geolocation; autoplay"></iframe>';if(loadError&&page!=='walk'){const n=document.createElement('p');n.className='notice error';n.textContent='일부 작품을 불러오지 못했습니다. 새로고침해 다시 시도해주세요.';view.prepend(n)}}

$('#auth').onclick=()=>session?go('my'):$('#login').showModal();$('#home').onclick=()=>go('music');$('.close').onclick=()=>$('#login').close();$('#stop').onclick=()=>{$('#audio').pause();$('#audio').removeAttribute('src');$('#audio').load();$('#player').hidden=true};
$('#login').querySelectorAll('[data-provider]').forEach(btn=>btn.onclick=()=>{nonce=[...crypto.getRandomValues(new Uint8Array(32))].map(x=>x.toString(16).padStart(2,'0')).join('');popup=window.open('../pyeoda/?pyoda_connect='+nonce+'&pyoda_app=rebuild&pyoda_provider='+btn.dataset.provider,'pyoda-login','width=460,height=720');$('#authStatus').textContent=popup?'인증 창에서 로그인을 완료해주세요.':'팝업이 차단됐습니다. 이 사이트의 팝업을 허용해주세요.';});

async function init(){if(!books||!music){view.innerHTML='<section><h2>연결 모듈을 불러오지 못했습니다.</h2><p>인터넷 연결을 확인하고 새로고침해주세요.</p></section>';return}session=(await books.auth.getSession()).data.session;musicSession=(await music.auth.getSession()).data.session;authUI();const results=await Promise.allSettled([music.from('tracks').select('id,creator_id,title,artist,genre,audio_storage,audio_path,published_at').eq('status','published').order('published_at',{ascending:false}),books.from('books').select('id,title,pen_name,genre,intro,cover_url,episode_count,age_rating').eq('published',true).eq('age_rating','all').order('created_at',{ascending:false})]);for(let i=0;i<results.length;i++){const r=results[i];if(r.status==='fulfilled'&&!r.value.error){if(i===0)tracks=r.value.data||[];else catalog=r.value.data||[]}else loadError=true}const p=location.hash.slice(1);page=['music','books','walk','my'].includes(p)?p:'music';shell();render();if(session&&!musicSession)exchange();}
